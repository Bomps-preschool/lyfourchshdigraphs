<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SH or CH Digraph Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     INNOVINE LOGO
     ========================= -->

<div id="splash">
    <img src="assets/innovine-logo.png"
         alt="Innovine Solutions">
</div>


<!-- =========================
     START SCREEN
     ========================= -->

<div id="startScreen" class="screen hidden">

    <div class="startCard">

        <div class="miniTitle">🔤</div>

        <h1>SH or CH?</h1>

        <p>Look at the picture and word.</p>

        <p>
            <strong>
                Tap on the correct digraph to complete the word.
            </strong>
        </p>

        <button id="startBtn"
                type="button"
                onclick="startGame()">
            ▶ Start Game
        </button>

    </div>

</div>


<!-- =========================
     GAME SCREEN
     ========================= -->

<div id="game" class="hidden">

    <header>

        <h1>SH or CH?</h1>

        <div class="topRow">

            <button id="hearBtn"
                    type="button">
                🔊 Hear
            </button>

            <div id="progress">
                1 / 10
            </div>

            <div id="score">
                ⭐ 0
            </div>

        </div>

    </header>


    <main>

        <section class="gameCard">

            <p id="instruction">
                Tap on the correct digraph to complete the word.
            </p>


            <!-- IMAGE -->

            <div class="pictureBox">

                <img id="itemImage"
                     src=""
                     alt="">

            </div>


            <!-- WORD -->

            <div id="wordBox"
                 class="wordBox">
            </div>


            <p class="hint">
                Tap the correct digraph.
            </p>


            <!-- ANSWERS -->

            <div class="answerRow">

                <button class="answerBtn"
                        type="button"
                        data-answer="sh">
                    sh
                </button>

                <button class="answerBtn"
                        type="button"
                        data-answer="ch">
                    ch
                </button>

            </div>

        </section>


        <!-- FEEDBACK -->

        <div id="feedback"
             class="hidden">
        </div>


        <!-- CONFETTI -->

        <div id="confetti">
        </div>

    </main>

</div>


<!-- =========================
     END SCREEN
     ========================= -->

<div id="endScreen"
     class="screen hidden">

    <div class="startCard">

        <div class="miniTitle">🏆</div>

        <h1>Great Job!</h1>

        <p id="finalScore"></p>

        <p>
            You are a digraph star! 🌟
        </p>

        <button id="againBtn"
                type="button"
                onclick="startGame()">
            🔄 Play Again
        </button>

    </div>

</div>


<!-- =========================
     AUDIO
     ========================= -->

<audio id="music"
       loop
       preload="auto">

    <source src="assets/background-music.mp3"
            type="audio/mpeg">

</audio>


<audio id="correctSound"
       preload="auto">

    <source src="assets/correct.mp3"
            type="audio/mpeg">

</audio>


<audio id="wrongSound"
       preload="auto">

    <source src="assets/wrong.mp3"
            type="audio/mpeg">

</audio>


<!-- =========================
     SPLASH TIMER
     ========================= -->

<script>

window.addEventListener("load", function () {

    setTimeout(function () {

        var splash =
            document.getElementById("splash");

        var startScreen =
            document.getElementById("startScreen");

        if (splash) {
            splash.style.display = "none";
        }

        if (startScreen) {
            startScreen.classList.remove("hidden");
        }

    }, 5000);

});

</script>


<script src="script.js"></script>

</body>
</html>
