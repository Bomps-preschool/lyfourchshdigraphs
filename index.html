<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digraph SH and CH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <img src="assets/innovine-logo.png" alt="Innovine Solutions">
</div>

<div id="startScreen" class="screen">
  <div class="startCard">
    <div class="miniTitle">🔤</div>
    <h1>SH or CH?</h1>
    <p>Look at the picture and word.</p>
    <p><strong>Tap on the digraph /ch/ or /sh/ to complete the word.</strong></p>
    <button id="startBtn" type="button">▶ Start Game</button>
  </div>
</div>

<div id="game" class="hidden">
  <header>
    <h1>SH or CH?</h1>
    <div class="topRow">
      <button id="hearBtn" type="button">🔊 Hear</button>
      <div id="progress">1 / 10</div>
      <div id="score">⭐ 0</div>
    </div>
  </header>

  <main>
    <section class="gameCard">
      <p id="instruction">Tap on the digraph /ch/ or /sh/ to complete the word.</p>

      <div class="pictureBox">
        <img id="itemImage" src="" alt="">
      </div>

      <div id="wordBox" class="wordBox"></div>

      <p class="hint">Tap the correct digraph.</p>

      <div class="answerRow">
        <button class="answerBtn" data-answer="sh" type="button">sh</button>
        <button class="answerBtn" data-answer="ch" type="button">ch</button>
      </div>
    </section>

    <div id="feedback" class="hidden"></div>
    <div id="confetti"></div>
  </main>
</div>

<div id="endScreen" class="screen hidden">
  <div class="startCard">
    <div class="miniTitle">🏆</div>
    <h1>Great Job!</h1>
    <p id="finalScore"></p>
    <p>You are a digraph star! 🌟</p>
    <button id="againBtn" type="button">🔄 Play Again</button>
  </div>
</div>

<audio id="music" loop preload="auto">
  <source src="assets/background-music.mp3" type="audio/mpeg">
</audio>
<audio id="correctSound" preload="auto">
  <source src="assets/correct.mp3" type="audio/mpeg">
</audio>
<audio id="wrongSound" preload="auto">
  <source src="assets/wrong.mp3" type="audio/mpeg">
</audio>

<script src="speech.js"></script>
<script src="script.js"></script>
</body>
</html>
